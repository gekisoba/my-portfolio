name: アプリデータの自動更新

on:
  schedule:
    # 毎週月曜 09:00 JST（= 00:00 UTC）
    - cron: '0 0 * * 1'
  # 手動実行もできるようにしておく（Actions タブから実行）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: App Store の情報を取得して data.json を更新
        run: python3 tools/update-data.py

      - name: 変化があればコミットする
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "変化がないため、コミットしません。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "アプリデータを自動更新

          tools/update-data.py による定期更新。評価・レビュー数・新規アプリを反映。"
          git push
          echo "更新をコミットしました。Cloudflare が自動でデプロイします。"
