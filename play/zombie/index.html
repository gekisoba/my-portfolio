/* Layout: full-screen night map of central Matsue, HUD pinned to corners, one overlay for start/clear */
:root{
  --bg:#0d0f12; --ink:#e8efe6; --dim:#8a958c; --zombie:#8bdc4a; --alert:#ff5a4e;
  --f-hud:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--f-hud)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
.hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));pointer-events:none;display:grid;gap:4px}
.stage{font-size:12px;color:var(--dim);letter-spacing:.12em}
.big{font-size:40px;line-height:1;color:var(--zombie);font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(139,220,74,.35)}
.big small{font-size:14px;color:var(--dim);margin-left:6px;letter-spacing:.08em}
.rows{display:grid;grid-template-columns:auto auto;gap:2px 12px;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.rows b{color:var(--ink);font-weight:400;text-align:right}
.bar{width:140px;height:4px;background:#22282a;margin-top:2px}
.bar i{display:block;height:100%;width:0;background:var(--zombie)}
#mini{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:120px;height:122px;border:1px solid #2c3330;background:#050607;pointer-events:none}
#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-size:18px;color:var(--alert);letter-spacing:.1em;pointer-events:none;opacity:0;transition:opacity .3s;text-shadow:0 0 10px rgba(255,90,78,.5);white-space:nowrap}
.log{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(38px + env(safe-area-inset-bottom,0px));max-width:min(78vw,420px);display:grid;gap:3px;font-size:11px;line-height:1.35;color:var(--ink);pointer-events:none;font-variant-numeric:tabular-nums}
.log div{background:rgba(8,10,12,.62);padding:2px 6px;justify-self:start;transition:opacity .6s}
.log b{color:var(--dim);font-weight:400;margin-right:6px}
.log .hot{color:var(--alert)}
.hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;color:var(--dim);pointer-events:none;letter-spacing:.08em}
.credit{position:fixed;right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:10px;color:var(--dim);font-family:system-ui,sans-serif}
.credit a{color:var(--dim)}
#ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,6,7,.6);padding:16px;overflow:auto}
.card{text-align:center;display:grid;gap:14px;max-width:340px}
.card .logo{font-size:15px;color:var(--ink);letter-spacing:.3em;opacity:.8}
.card .pref{font-size:13px;color:var(--dim);letter-spacing:.3em}
.card h1{margin:0;font-weight:400;font-size:clamp(28px,9vw,44px);letter-spacing:.12em;color:var(--zombie);text-wrap:balance}
.card p{margin:0;color:var(--ink);font-size:14px;line-height:1.7}
.card .sub{color:var(--dim);font-size:12px}
.stages{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.stages a{font-size:12px;color:var(--dim);text-decoration:none;border:1px solid #2c3330;padding:4px 10px;letter-spacing:.1em}
.stages a[aria-current]{color:var(--zombie);border-color:var(--zombie)}
button{font-family:var(--f-hud);font-size:18px;letter-spacing:.2em;padding:10px 28px;background:transparent;color:var(--zombie);border:1px solid var(--zombie);cursor:pointer;justify-self:center}
button.ghost{font-size:13px;padding:6px 16px;color:var(--ink);border-color:#4a524d}
.btns{display:flex;flex-direction:column;gap:12px;align-items:center}
button:hover,button:focus-visible{background:var(--zombie);color:var(--bg);outline:none}
