:root{
  --bg:#05060c; --ink:#f4f1ff; --dim:#a9a6c4; --chip:rgba(10,12,28,.62); --chip-on:#ffcf6b; --line:rgba(255,255,255,.18);
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--font)}
body{touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100vw;height:100vh;background:var(--bg);overflow:hidden}
#err{position:absolute;left:8px;right:8px;top:40%;font:12px monospace;color:#ff9b9b;white-space:pre-wrap;pointer-events:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#c{filter:saturate(.72) contrast(.9) brightness(1.05) sepia(.08)}
#bloom{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;opacity:.42;filter:blur(3px) saturate(.75) brightness(1.1)}
#grain{position:absolute;inset:0;width:100%;height:100%;opacity:.035;mix-blend-mode:overlay;pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 70% at 50% 48%,rgba(0,0,0,0) 55%,rgba(10,6,20,.42) 100%)}
.hud{transition:opacity .6s}
#wrap:not(.ui) .hud{opacity:0;pointer-events:none}
#wrap:not(.ui) .hud .chips{pointer-events:none}
.hud{position:absolute;left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:0 12px;pointer-events:none;text-shadow:0 1px 0 rgba(0,0,0,.7)}
#top{top:10px;align-items:flex-start}
#bottom{bottom:12px;align-items:flex-end}
.stack{display:flex;flex-direction:column;gap:2px}
#clock{font-size:20px;letter-spacing:.04em}
#phase,#moon,#zone,#wx,#day{font-size:12px;color:var(--dim)}
#speed{font-size:26px;text-align:right;font-variant-numeric:tabular-nums}
#speed small{font-size:12px;color:var(--dim);margin-left:3px}
#dist{font-size:12px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px;pointer-events:auto;justify-content:flex-end;max-width:62%}
.chips.left{justify-content:flex-start;max-width:66%}
button{font-family:var(--font);font-size:12px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:5px 7px;cursor:pointer;line-height:1}
button[aria-pressed="true"]{background:var(--chip-on);color:#1a1206;border-color:var(--chip-on)}
button:focus-visible{outline:2px solid var(--chip-on);outline-offset:1px}
#aclock{--ck:clamp(56px,min(23vw,21vh),130px);position:absolute;left:0;right:0;top:24px;text-align:center;pointer-events:none;color:rgba(255,250,240,.86);text-shadow:0 1px 2px rgba(0,0,0,.45),0 0 12px rgba(0,0,0,.3);transition:opacity .8s;font-variant-numeric:tabular-nums}
#aclock .t{font-size:22px;letter-spacing:.06em;line-height:1}#aclock .d{font-size:10px;letter-spacing:.2em;color:rgba(255,246,230,.7);margin-top:5px}
#aclock.big .t{font-size:var(--ck);letter-spacing:.03em}#aclock.big .d{font-size:clamp(12px,calc(var(--ck)*.17),18px);margin-top:10px}
#aclock.off,#wrap.ui #aclock{opacity:0}
#aclock.mid .t{font-size:46px;letter-spacing:.04em}#aclock.mid .d{font-size:12px;margin-top:8px}#aclock.mid~#toast{top:max(15%,118px)}
#aclock.big~#toast{top:calc(24px + var(--ck) + 56px)}#aclock.small~#toast{top:max(15%,76px)}
#toast{position:absolute;left:0;right:0;top:15%;text-align:center;font-size:15px;letter-spacing:.35em;pointer-events:none;opacity:0;transition:opacity 2s;text-shadow:0 1px 6px rgba(0,0,0,.5);color:rgba(255,250,240,.9)}
#toast small{display:block;font-size:10px;letter-spacing:.5em;color:rgba(255,236,200,.75);margin-bottom:6px}
#toast.on{opacity:1}
#radio{position:absolute;left:14px;bottom:20px;font-size:12px;letter-spacing:.12em;color:rgba(255,250,240,.85);text-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity 1.6s;display:flex;flex-direction:column;gap:2px}
#radio small{font-size:9px;letter-spacing:.4em;color:rgba(255,236,200,.7)}
#radio.on{opacity:1}
#wrap.ui #radio{opacity:0}
[hidden]{display:none!important}
#fade{position:absolute;inset:0;background:#05060c;opacity:0;pointer-events:none;transition:opacity .6s;z-index:6}
#fade.on{opacity:1;pointer-events:auto}
#sel{position:absolute;inset:0;background:rgba(8,8,20,.78);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 16px;z-index:5}
#sel .sh{font-size:15px;letter-spacing:.4em;margin-bottom:6px}
#sel .sg{font-size:11px;letter-spacing:.4em;color:rgba(255,236,200,.8);margin-top:6px}
#sel .sb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:min(320px,100%)}
#sel .sb button{font-size:14px;padding:10px 6px;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.22)}
#sel .sb button.cur{border-color:var(--chip-on);color:var(--chip-on)}
#log{position:absolute;inset:0;background:rgba(8,8,20,.82);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px 20px;z-index:5;overflow-y:auto}
#log .sh{font-size:15px;letter-spacing:.4em}
#log .sg{font-size:11px;letter-spacing:.3em;color:rgba(255,236,200,.85);margin-top:8px;align-self:stretch;max-width:340px;width:100%;margin-inline:auto}
.lsum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:min(340px,100%)}
.ls{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid rgba(255,255,255,.14);border-radius:6px}
.ls span{font-size:10px;color:var(--dim);letter-spacing:.15em}.ls b{font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
.lcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;width:min(340px,100%)}
.lc{font-size:11px;text-align:center;padding:6px 2px;border-radius:4px;border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.3)}
.lc.on{color:var(--ink);border-color:rgba(255,207,107,.5)}
.lls{display:flex;flex-direction:column;gap:4px;width:min(340px,100%)}
.ll{display:flex;flex-direction:column;gap:1px;padding:6px 10px;border-left:2px solid rgba(255,255,255,.1)}
.ll b{font-weight:400;font-size:13px;color:rgba(255,255,255,.35)}.ll span{font-size:10px;color:rgba(255,255,255,.3)}
.lh{margin:14px 0 4px;font-size:11px;letter-spacing:.1em;color:var(--dim)}.ll.rare.on{border-left-color:#e8c46a}.ll.rare.on b{color:#f2d98c}.ll.on{border-left-color:var(--chip-on)}.ll.on b{color:var(--ink)}.ll.on span{color:var(--dim)}
#logClose{margin-top:12px;font-size:13px;padding:8px 18px;flex:none}
#selClose{margin-top:10px;font-size:13px;padding:8px 18px}
#fork{position:absolute;left:0;right:0;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.5)}
#fork .ft{font-size:11px;letter-spacing:.5em;color:rgba(255,236,200,.85)}
#fork .fb{display:flex;gap:10px;pointer-events:auto}
#fork button{font-size:14px;padding:9px 14px;background:rgba(20,22,40,.45);border-color:rgba(255,255,255,.35);border-radius:6px;letter-spacing:.1em}
#hint{position:absolute;left:0;right:0;bottom:40px;text-align:center;font-size:12px;line-height:1.9;color:var(--dim);pointer-events:none;transition:opacity 1s}@media (orientation:landscape){#hint{left:16px;right:auto;bottom:14px;text-align:left}}#hint .dm{display:block;font-size:10px;letter-spacing:.3em;color:var(--chip-on)}#demoTag{font-size:10px;letter-spacing:.2em;color:var(--chip-on);margin-top:4px}
@media (prefers-reduced-motion: reduce){#toast,#hint{transition:none}}
</style>
</head>
<body>

<div id="wrap">
  <canvas id="c" aria-label="道路を走る車の画面"></canvas>
  <canvas id="bloom" aria-hidden="true"></canvas>
  <canvas id="grain" width="96" height="170" aria-hidden="true"></canvas>
  <div id="vig"></div>
  <div class="hud" id="top">
    <div class="stack"><div id="clock">--:--</div><div id="phase"></div><div id="wx"></div><div id="moon"></div><div id="zone"></div><div id="day"></div><div id="demoTag">開発中デモ</div></div>
    <div class="chips" id="modes" role="group" aria-label="時間帯">
      <button id="m-real" data-m="real" aria-pressed="true">実時間</button>
      <button id="m-am" data-m="7.2" aria-pressed="false">朝</button>
      <button id="m-noon" data-m="12.5" aria-pressed="false">昼</button>
      <button id="m-eve" data-m="17.6" aria-pressed="false">夕</button>
      <button id="m-night" data-m="21" aria-pressed="false">夜</button>
      <button id="m-ff" data-m="ff" aria-pressed="false">早送り</button>
    </div>
  </div>
  <div id="aclock" class="big"><div class="t">--:--</div><div class="d"></div></div>
