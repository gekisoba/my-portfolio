<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>銘柄コード — クリッカーカンパニー</title>
<meta name="description" content="クリッカーカンパニーの銘柄コードです。アプリを入れて、このコードを入力すると、その会社の株を買えるようになります。">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="クリッカーカンパニー — 銘柄コード">
<meta property="og:description" content="アプリを入れて、このコードを入力してください。">
<meta property="og:locale" content="ja_JP">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="stylesheet" href="/assets/style.css?v=7">
<link rel="stylesheet" href="/assets/lp.css?v=7">
<style>
  .kabu-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: clamp(2.5rem, 14vw, 4.5rem);
    font-weight: 700;
    letter-spacing: 0.18em;
    margin: 0.4em 0 0.2em;
    word-break: break-all;
  }
  .kabu-note { opacity: 0.75; font-size: 0.95rem; line-height: 1.8; }
  .kabu-steps { text-align: left; display: inline-block; margin: 1.2em 0; line-height: 2; }
</style>
</head>
<body>

<header class="lp-header">
  <div class="wrap">
    <a class="back-link" href="/">← ポートフォリオ</a>
  </div>
</header>

<main>
  <section class="lp-hero">
    <div class="wrap" style="text-align:center">
      <p class="kabu-note" id="lead">クリッカーカンパニーの銘柄コード</p>
      <p class="kabu-code" id="code">････</p>

      <ol class="kabu-steps" id="steps">
        <li>アプリを入れる</li>
        <li>株式ボタン → 投資タブ → コード</li>
        <li>「打つ」にこのコードを入力</li>
      </ol>

      <p><a class="btn btn-primary" href="https://gekisoba.com/clicker" target="_blank" rel="noopener">App Store で入手</a></p>

      <p class="kabu-note">
        アプリを入れたあとにこのページを開くと、アプリが直接開いてコードが入ります。
      </p>
    </div>
  </section>
</main>

<script>
  // コードはパスの最後。/kabu/K7Q2 のように渡ってくる。
  // **使えない文字を捨ててから通してはいけない。** それをやると
  // /kabu/nonsense が「NNSEN」という、もっともらしい偽のコードになる。
  // アプリ側（KabuLink）と同じく、形が合っているものだけを通す
  const raw = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
  const code = raw.toUpperCase();
  const el = document.getElementById("code");
  if (/^[23456789ABCDEFGHJKMNPQRSTUVWXYZ]{4,5}$/.test(code)) {
    el.textContent = code;
    document.title = code + " — クリッカーカンパニー";
  } else {
    el.textContent = "？？？？";
    el.style.opacity = "0.35";
    document.getElementById("lead").textContent = "このコードは読み取れませんでした";
    document.getElementById("steps").hidden = true;
  }
</script>

</body>
</html>
